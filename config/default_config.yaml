# ==========================================================================
#  Yunzai-LLM-Plugin 默认配置（请勿直接修改本文件）
#  需要修改的项写到 Yunzai/config/Yunzai-LLM-Plugin/config.yaml 里（只写要覆盖的部分即可），
#  或者私聊机器人用指令修改：#llm帮助 查看全部指令。
#  config.yaml 修改后自动热重载。
# ==========================================================================

# 总开关
enable: true

# 插件管理员 QQ（Yunzai 主人默认就是管理员，这里可以额外添加）
admins: []

# --------------------------------------------------------------------------
# 提供商：type 可选
#   openai            OpenAI Chat Completions 兼容接口（通义/Kimi/智谱/OpenRouter/Ollama 等绝大多数）；也可提供 /embeddings 向量模型
#   openai-responses  OpenAI Responses API（/v1/responses，OpenAI 与 DeepSeek）
#   anthropic         Anthropic Messages API 及兼容接口（/v1/messages）
#   gemini            Gemini Interactions API（/v1beta/interactions）
#   voyage            Voyage AI 向量接口（只用于向量模型）
#   systemone         TypeSafe System One 分类接口（Jev，或自建 Kev 填 http://127.0.0.1:8009/v1），用于判断模型
# apiKey 可以是字符串或列表（多个 Key 自动轮换）；写成 env:变量名 则从环境变量读取。
# 建议私聊机器人发送 #llm设置密钥 <提供商> <Key> 设置，不要在群里发 Key。
# --------------------------------------------------------------------------
providers:
  # 提供商名称，模型的 provider 引用这个键
  anthropic:
    # 接口协议，见上方 type 列表
    type: anthropic
    # API 根地址，兼容服务可换成自己的地址
    baseUrl: https://api.anthropic.com
    # 服务密钥；支持列表和 env:变量名，留空则不可用
    apiKey: ''
    # 缓存时长 5m / 1h（1h 写入价格为 2 倍，适合聊天间隔较长的群）
    cacheTtl: 5m
  # OpenAI 提供商配置
  openai:
    # Responses 协议；Chat Completions 兼容服务用 openai
    type: openai-responses
    # API 根地址，保留服务要求的 /v1 前缀
    baseUrl: https://api.openai.com/v1
    # 服务密钥；支持列表和 env:变量名
    apiKey: ''
  # Gemini 提供商配置
  gemini:
    # Gemini Interactions 协议
    type: gemini
    # API 根地址
    baseUrl: https://generativelanguage.googleapis.com
    # 服务密钥；支持列表和 env:变量名
    apiKey: ''
    # 使用服务端会话状态(previous_interaction_id)，减少重复上传历史
    serverState: true
  # DeepSeek 提供商配置
  deepseek:
    # Responses API：支持工具调用、图片输入（deepseek-flash）和自带联网搜索（deepseek-v4-pro）
    type: openai-responses
    # API 根地址
    baseUrl: https://api.deepseek.com
    # 服务密钥；支持列表和 env:变量名
    apiKey: ''
    # 余额查询适配器；可选 deepseek/openrouter/moonshot/siliconflow/none
    balance: deepseek
  # Voyage AI 向量服务（旧聊天向量检索）
  voyage:
    # 向量接口
    type: voyage
    # API 根地址
    baseUrl: https://api.voyageai.com/v1
    # 服务密钥；支持 env:变量名
    apiKey: ''
    # 单次向量请求超时，单位秒
    timeout: 10
  # TypeSafe System One（Jev），用于自动思考强度和主动发言的判断
  typesafe:
    # System One 分类接口；自建 Kev 另加一个 systemone 提供商，地址填 http://127.0.0.1:8009/v1
    type: systemone
    # API 根地址（请求发往 <地址>/systemone）
    baseUrl: https://api.typesafe.ai/v1
    # Jev 服务密钥（需申请）；支持 env:变量名
    apiKey: ''

# --------------------------------------------------------------------------
# 聊天模型列表。id 是在指令里使用的别名（与向量模型、System One 模型的 id 不能重复）。
#   thinking:  off / minimal / low / medium / high / xhigh / max / auto（不写则用 chat.thinking）
#   autoThinking: thinking 为 auto 时，各消息类别使用的思考强度（不写的类别用 autoThinking.levels）
#   vision:    是否支持图片输入（默认 true）
#   nativeSearch: 联网搜索设为 native 时，是否使用该模型自带的搜索（默认 true）
#   pricing:   auto（自动从价格表获取）或 {input, output, cacheRead, cacheWrite} 单位：美元/百万token
#   pricingId: 价格表里的模型名（与 model 不同时填写）
#   quota:     额度（美元，滚动窗口）。简写 {window5h, weekly} 作用于 quota.defaultScope；
#              也可分别设置 {user: {...}, group: {...}, global: {...}}，0 或不写表示不限
#   extraBody: 原样合并进请求体的额外参数（用于各家特有参数）
# --------------------------------------------------------------------------
# 模型名均为各家官方 API 的模型 ID（2026-10-29 核对）；价格自动从价格表获取。
models:
  # DeepSeek：deepseek-flash（V4.1，便宜，分峰谷计价，按高峰价统计；支持图片和工具，不支持自带搜索）
  # 本地模型别名
  - id: deepseek
    # 提供商配置名称
    provider: deepseek
    # 上游 API 的模型 ID
    model: deepseek-flash
    # 按消息自动选择思考强度（见 autoThinking）；DeepSeek 实际只区分 off / low / high / max
    thinking: auto
    # thinking 为 auto 时各类消息的思考强度
    autoThinking:
      casual: 'off'
      question: low
      complex: high
    pricing: auto
    # 是否允许使用工具调用
    toolUse: true
    # 是否支持直接图片输入
    vision: true
    # deepseek-flash 会忽略自带搜索工具（只有 deepseek-v4-pro 支持）
    nativeSearch: false
  # DeepSeek V4 Pro：工具调用和自带联网搜索；不支持图片输入
  - id: deepseek-pro
    # 提供商配置名称
    provider: deepseek
    # 上游 API 的模型 ID
    model: deepseek-v4-pro
    # 按消息自动选择思考强度
    thinking: auto
    # thinking 为 auto 时各类消息的思考强度
    autoThinking:
      casual: low
      question: high
      complex: max
    pricing: auto
    # 是否允许使用工具调用
    toolUse: true
    # 是否支持直接图片输入
    vision: false
    # 使用 DeepSeek 服务端联网搜索
    nativeSearch: true

# --------------------------------------------------------------------------
# 向量模型（旧聊天向量检索，memory.embedding.model 选择其中一个 id）。
#   provider 为 voyage 或 OpenAI 兼容（openai / openai-responses，请求 <地址>/embeddings）的提供商
#   dimensions: voyage-4 系列支持 256 / 512 / 1024 / 2048；改模型或维度后旧向量会自动重建
# --------------------------------------------------------------------------
embeddingModels:
  # Voyage 上下文向量模型（同一天的片段一起编码）
  - id: voyage-context-4
    # 提供商配置名称
    provider: voyage
    # 上游 API 的模型 ID
    model: voyage-context-4
    # 向量维度
    dimensions: 512

# --------------------------------------------------------------------------
# System One 分类模型（可作为 autoThinking.judge / proactive.judge 的判断模型）
# --------------------------------------------------------------------------
systemoneModels:
  # TypeSafe Jev
  - id: jev
    # 提供商配置名称
    provider: typesafe
    # 上游模型名
    model: jev-latest

# 默认模型 id。留空 = 自动选择第一个配置了 Key 的模型
defaultModel: ''
# 默认模型额度用完/不可用时依次尝试的模型
fallbackModels: [deepseek]
# 后台任务（对话摘要、表情识别）使用的便宜模型；留空 = 默认模型。
# 这类调用不做消息判断：若该模型的思考强度为 auto，固定使用 autoThinking 第一个类别的强度
utilityModel: ''
# 默认模型不支持图片时用于识图的模型（表情识别也会优先用它）
visionModel: ''

# --------------------------------------------------------------------------
# 人设。{botName} 会被替换为机器人昵称（persona.botName 留空则用 QQ 昵称）
# --------------------------------------------------------------------------
persona:
  # 机器人显示名；留空使用平台昵称
  botName: ''
  # 当前使用的人设名称，对应 presets 的键
  active: default
  # 人设名 -> 人设正文；可添加多个供群配置选择
  presets:
    # 默认人设正文，支持 {botName} 占位符
    default: |
      你是「{botName}」，平时混在QQ群里的一个普通群友。性格开朗随和，有点小幽默，懂游戏（尤其是原神、崩坏：星穹铁道、绝区零）和动漫，也乐意帮大家查资料、解答问题。
      说话像真人：口语化、简洁，偶尔用点网络用语，但不刻意卖萌；不会每句话都加表情或语气词。
      别人请你帮忙时认真靠谱；开玩笑时也能接梗。被问到身份时可以坦然说自己是群里的AI助手。

# --------------------------------------------------------------------------
# 分群设置：键为群号，可覆盖 enable / model / persona / thinking / chat / reply / sticker / tools / proactive
# 主动发言只能在这里按群开启（proactive.enable），其余参数默认取顶层 proactive。
# 例：
# groups:
#   '123456789':
#     enable: false
#   '987654321':
#     model: deepseek-pro
#     persona: default
#     sticker: { probability: 0.3 }
#     proactive: { enable: true, probability: 0.3 }
# --------------------------------------------------------------------------
groups: {}

# --------------------------------------------------------------------------
# 群友称呼：平台ID -> 名字。优先于适配器提供的昵称/群名片（QQBot 等拿不到昵称时尤其有用）。
# 用于对话里的发言人、最近群友、群聊记录和长期记忆的称呼。某个群里单独的称呼写在 groups.<群号>.names。
# 例：
# names:
#   '123456789': 岛风
#   'A1B2C3D4E5F6': 天津风       # QQBot 的用户 ID
# --------------------------------------------------------------------------
names: {}

# --------------------------------------------------------------------------
# 触发方式：被明确呼叫时回复；主动发言需在群设置里单独开启（见 proactive）
# --------------------------------------------------------------------------
trigger:
  # 群里 @机器人
  at: true
  # 引用(回复)机器人的消息
  replyToBot: true
  # Yunzai 的 botAlias 前缀（group.yaml 里配置的机器人别名）也算呼叫
  alias: false
  # 额外的触发前缀，例如 ['#ai']（注意不要和其它插件指令冲突）
  prefixes: []
  # 私聊：off 关闭 / master 仅主人和插件管理员 / all 所有人
  private: master
  # 仅允许这些群触发；空列表表示不限制
  groupWhitelist: []
  # 禁止触发的群号，优先于白名单
  groupBlacklist: []
  # 禁止触发的用户平台 ID
  userBlacklist: []
  # 插件优先级，务必保持最低（数字最大），这样不会抢其它插件的指令
  priority: 99999
  # 同一用户两次触发的最小间隔（秒），管理员不受限
  userCooldown: 3

# --------------------------------------------------------------------------
# 对话与上下文
# --------------------------------------------------------------------------
chat:
  # user = 群里每个人独立记忆；group = 全群共享一段记忆
  sessionScope: user
  # 多久没聊天后重置当前对话（分钟）；旧聊天档案和长期记忆仍保留
  sessionTimeout: 180
  # 记忆上限（超过后一次性丢弃较早的一半，比逐条滑动更省 token：缓存前缀保持不变）
  # 一轮 = 一条用户消息 + 一条机器人回复；20 轮最多 40 条历史消息
  historyMaxTurns: 10
  # 同一会话最多排队多少条请求；超出时提示繁忙
  maxPending: 20
  # 最近群友身份条数，0 关闭，最大 30；只列称呼与 ID
  rosterSize: 12
  # 已保存对话历史的估算 token 上限，与轮数限制共同生效
  historyMaxTokens: 8192
  # 丢弃的历史用便宜模型压缩成摘要保留
  summarize: true
  # 滚动摘要、群聊档案和每日概要的输出预算（包含模型思考 token）
  summaryMaxTokens: 8192
  # 附带的最近群聊条数，0–100（帮助理解语境；不会写入长期记忆）
  groupContext: 16
  # 最近群聊的时间范围（分钟），默认720分钟=12小时；与会话过期时间无关
  groupContextMaxAgeMinutes: 720
  # 每条最近群聊最多附带多少字符
  groupContextMaxChars: 200
  # 单次回复最多调用几轮工具（每轮可并行多个调用；只调用辅助工具的轮次也计入；0 关闭全部工具）
  maxToolRounds: 24
  # 普通工具合计调用次数（并行分别计数；辅助工具 send_image/read_image/load_skill/list_stickers 不占；0 仅保留辅助工具）
  maxToolCalls: 20
  # 单次最大输出 token（含思考）
  maxOutputTokens: 8192
  # 温度，null = 不发送该参数（推荐，部分新模型不支持自定义温度）
  temperature: null
  # 默认思考强度（模型可单独设置）：off / minimal / low / medium / high / xhigh / max，
  # 或 auto = 由判断模型按消息类别自动选择（见 autoThinking）
  thinking: low
  # 是否把用户发的图片给模型看
  includeImages: true
  # 每轮最多传给模型几张图片（含引用图片）
  maxImages: 2
  # 是否读取用户引用的那条消息
  includeQuoted: true

# --------------------------------------------------------------------------
# 自动思考强度：模型的 thinking 为 auto 时，先由判断模型把消息归入一个类别，再用该模型为这个类别设置的思考强度
# （models[].autoThinking，未设置的类别用这里的 levels）。判断模型只评估最后一条消息，最近聊天只用于理解语境。
# 判断出错或超时时使用第一个类别。后台任务（摘要、识图等）不做判断，也固定使用第一个类别的强度。
# --------------------------------------------------------------------------
autoThinking:
  # 判断模型：聊天模型 id（约 0.6~1s，每条约 300 token；建议关闭思考的便宜模型）或 System One 模型 id（如 jev）。
  # 留空 = utilityModel → 默认模型
  judge: ''
  # 判断请求超时，单位毫秒；超时或出错使用第一个类别
  timeoutMs: 5000
  # 附带的最近消息条数（本会话的对话和最近群聊各取这么多），帮助判断“那第二个呢”这类追问；0 = 只看当前消息
  context: 6
  # 各类别的默认思考强度；每个模型可在 models[].autoThinking 覆盖
  levels:
    casual: low
    question: medium
    complex: high
  # 消息类别：判断模型按描述选一个，输出类别名。可增删改；第一个类别也是出错时的后备类别
  categories:
    # 闲聊
    - name: casual
      # 给判断模型看的描述
      description: 闲聊、打招呼、玩梗、逗机器人、问机器人自己（你是谁/你喜欢什么/你觉得呢）、让机器人执行查询指令（查面板、深渊、体力等）、让机器人记住某事或发表情；只发表情包或梗图配一句玩笑；只@机器人没说话。
    # 普通问题
    - name: question
      # 给判断模型看的描述
      description: 有明确答案、一两步就能答的问题：一个事实、定义、日期、价格、版本、属性、简单用法、短句翻译、常识科普；附带需要看懂的图片（不是表情包）时至少属于这一类：这是什么、图里写了什么、认出角色/物品/地点。
    # 复杂问题
    - name: complex
      # 给判断模型看的描述
      description: 需要多步推理或综合信息：配队/抽卡/资源规划、比较分析、写代码或排查报错、计算、写文章、制定计划、整理攻略、汇总多个来源的新闻、根据对方给出的条件出主意；看图分析：截图里的报错/代码/题目/图表数据、根据图片给建议、一张图问多件事。

# --------------------------------------------------------------------------
# 未被@时自主插话。需在「分群设置」按群开启（此处为默认参数）。
# 消息经概率抽签后由模型评分，超过动态阈值即回复（不扣发言人额度）。
# --------------------------------------------------------------------------
proactive:
  # 消息抽中概率（第 1 层筛选）
  probability: 0.3
  # 判断窗口（秒）：窗口内抽中时评估一次
  window: 60
  # 判断模型（always=仅按概率；留空=继承自动思考判断模型）
  judge: ''
  # 附带评估的最近群聊条数
  context: 12
  # 给判断模型看的标准
  criteria:
    # 适合插话的情况
    reply: 有人在问一个你能回答而还没人回答的问题；话题和你的人设、兴趣或之前聊过的内容有关，你能自然地接上一句；有人提到你但没有@你；气氛热闹、接一句玩笑很自然。
    # 不该插话的情况
    skip: 两三个人之间的私人对话；和你无关或你插不上话的话题；问题已经有人回答；刷屏、纯表情或无意义的消息；严肃或敏感的讨论；你刚说过话、再说会显得话多。
  # 触发阈值曲线（随距上次回复的时间衰减）
  threshold:
    # 刚回复时的初始阈值（越高越不易连发）
    start: 0.95
    # 久未回复时的最低阈值
    end: 0.6
    # 阈值衰减半衰期（秒）
    halfLife: 900

# --------------------------------------------------------------------------
# 额度（按实际计费换算的美元金额，5小时 / 7天滚动窗口；具体数额在每个模型的 quota 里设置）
# --------------------------------------------------------------------------
quota:
  # 模型 quota 简写 {window5h, weekly} 的作用范围：user / group / global
  defaultScope: user
  # 管理员不受 user/group 额度限制（global 仍然生效）
  exemptAdmins: true
  # 额度用完的提示，同一个人多久最多提示一次（秒）
  notifyCooldown: 1800

# --------------------------------------------------------------------------
# 回复行为（降低风控：像真人一样发消息）
# --------------------------------------------------------------------------
reply:
  # 引用回复：auto = 群里有人插话或回复较慢时才引用 / always / never
  quote: auto
  # 不引用时是否 @ 对方
  atUser: false
  # 一次回复最多分几条消息发送
  maxBubbles: 2
  # 超过这个字数：forward = 合并转发一条发送 / truncate = 截断
  maxChars: 500
  # 超过 maxChars 的处理方式：forward / truncate
  longText: forward
  # 去掉 Markdown 符号（QQ 不渲染 Markdown）
  stripMarkdown: true
  # 以 Markdown 输出：false = 纯文本（OneBot/NapCat 不支持 Markdown）/ true = Markdown（如 QQ 官方机器人 QQBot）
  # auto = 只有消息来自 QQBot 适配器时才用 Markdown。开启后不再拆分多条、不去除 Markdown 符号
  markdown: false
  # 模拟打字的延迟（毫秒），已经花在思考上的时间会被扣除
  typing:
    # 估算打字速度，每秒字符数
    charsPerSecond: 12
    # 最短打字延迟，毫秒
    minDelay: 600
    # 最长打字延迟，毫秒
    maxDelay: 5000
  # 发送频率上限（条/秒数）。超出时合并或放弃，绝不刷屏
  groupRate:
    # 每个群在时间窗口内最多发送几条消息
    count: 6
    # 每群发送频率的时间窗口，单位秒
    perSeconds: 60
  # 全局每 60 秒最多发送 30 条
  globalRate:
    # 全部会话在时间窗口内合计最多发送几条消息
    count: 30
    # 全局发送频率的时间窗口，单位秒
    perSeconds: 60
  # 同时进行的 LLM 请求数
  concurrency: 3
  # 出错时是否提示（有冷却）
  errorNotice: true
  # 同一错误提示的冷却时间，单位秒
  errorCooldown: 600
  # 私聊时显示“对方正在输入…”（NapCat）
  privateTyping: true

# --------------------------------------------------------------------------
# 表情包
# --------------------------------------------------------------------------
sticker:
  # 是否启用表情包选择与发送
  enable: true
  # 模型想发表情时实际发送的概率（模型本身也被要求“偶尔才发”）
  probability: 1
  # 同一会话两次表情的最小间隔（秒）
  cooldown: 30
  # 提示词里最多列出多少个表情
  maxInPrompt: 60
  # 识别表情用的视觉模型 id（留空 = visionModel / utilityModel / 默认模型）
  indexModel: ''
  # sticker = 以表情形式发送（QQ 显示为动画表情）/ image = 普通图片
  sendAs: sticker
  # 发送时把大图缩小到这个尺寸以内（像素）。QQ 会把大尺寸图片显示成普通图片而不是表情；0 = 发送原图（GIF 动图始终发原图）
  maxSendSize: 240

# --------------------------------------------------------------------------
# 工具
# --------------------------------------------------------------------------
tools:
  # 所有模型工具的总开关
  enable: true
  # 以下辅助工具不占 chat.maxToolCalls，但所在轮次计入 chat.maxToolRounds；单工具每次回复次数范围0–32，0禁用；失败/无效参数也计数
  sendImage:
    maxPerTurn: 2
  readFile:
    maxPerTurn: 8
  loadSkill:
    maxPerTurn: 8
  listStickers:
    maxPerTurn: 4
  # 联网搜索，与网页读取独立配置
  webSearch:
    # 是否启用搜索；还需有效的服务或模型配置
    enable: true
    # native = 使用模型自带搜索（anthropic / openai-responses / gemini 类型支持）
    # deepseek = DeepSeek Search；apiKey 留空复用 providers.deepseek.apiKey
    # anysearch = AnySearch（apiKey 可选，不填用匿名额度、限速更低）
    # tavily / brave 需要 apiKey；jina 的 apiKey 可选；searxng 需要 baseUrl；none = 关闭
    provider: native
    # 外部搜索服务密钥，支持 env:变量名
    apiKey: ''
    # SearXNG 实例地址；其他搜索服务通常不需要
    baseUrl: ''
    # 每次搜索最多返回几条结果
    maxResults: 5
    # 每轮最多搜索次数
    maxPerTurn: 3
  # 展开网页链接的正文内容
  webFetch:
    # 是否允许模型读取网页
    enable: true
    # 返回给模型的最大字符数
    maxChars: 8192
    # 单次网页读取超时，单位秒
    timeout: 15
    # deepseek = DeepSeek Fetch；复用 DeepSeek 搜索或提供商密钥
    # direct = 直接抓取 / jina = 通过 r.jina.ai 读取（可选 jinaKey）
    reader: direct
    # Jina Reader 密钥，可选；支持 env:变量名
    jinaKey: ''
    # 允许访问内网地址（危险，默认禁止）
    allowPrivateNetwork: false
    # 每轮最多打开网页次数
    maxPerTurn: 10
  # 把自然语言请求转换为已验证的机器人插件指令
  botCommand:
    # 允许把自然语言转成当前已启用插件的指令执行
    enable: true
    # 系统提示里列出的已验证指令数量，其余可通过 search_bot_commands 搜索
    inPrompt: 50
    # 执行指令后是否再发送模型的附带文字
    ack: false
    # 是否允许通过对话执行主人权限指令
    allowMasterCommands: false
    # 禁止通过对话执行的指令（正则）
    blacklist:
      - '^#?(重启|关机|停机|开机|上线|下线)'
      - '^#?(强制|全部)?更新'
      - '^#?(安装|卸载|删除)插件'
      - '^#?退群'
      - '^#?(设置|添加|删除)主人'
    # 手动补充的指令说明（会提示给模型），如：
    # - { cmd: '#今日运势', desc: '抽一张今日运势签' }
    hints: []
  # HTTP 工具：让模型调用一个 HTTP 接口，{参数名} 会替换到 url，{{参数名}} 会替换到 body
  # - name: weather
  #   description: 查询城市天气
  #   parameters: { type: object, properties: { city: { type: string } }, required: [city] }
  #   url: https://wttr.in/{city}?format=3&lang=zh
  http: []
  # 模型可把 HTML 渲染成图片发送（用于表格、多维对比、排版复杂的内容；代码、命令、链接和普通长文仍发文字）。页面脚本被禁用，只能加载公网资源
  renderHtml:
    # 是否启用 HTML 转图片工具
    enable: true
    # 截图页面宽度，单位像素
    width: 720
    # 截图最大高度，单位像素
    maxHeight: 6000
    # 是否允许页面加载公网图片、字体等资源
    allowNetwork: true
  # 运行代码（Python / Node / Bash），在专用 WSL 发行版里用 bubblewrap 隔离执行：
  # 看不到 Windows 磁盘和机器人文件，只能访问公网（内网/本机/路由器都被防火墙拦截），有内存/时间/磁盘上限。
  # 先在服务器上运行 `npm run exec-setup -- --install` 创建并配置发行版，再开启。
  exec:
    # 安装完成并通过检查后再启用代码工具
    enable: false
    # 专用 WSL 发行版名称
    distro: yunzai-llm-sandbox
    # admin=仅管理员可触发；all=所有人
    access: admin
    # 允许执行的语言；空列表禁用执行
    languages: [python, node, bash]
    # 每次运行最多秒数（≤50）
    timeout: 20
    # 单次运行的内存上限，单位 MB
    memoryMB: 512
    # 单次运行的临时磁盘上限，单位 MB
    diskMB: 128
    # 返回给模型的输出字符数
    maxOutput: 4000
    # 每次聊天回复最多执行几次代码
    maxRunsPerTurn: 3
  # 持久电脑代理：先 npm run computer-setup -- --distro <发行版>，任务使用独立队列
  computer:
    # 是否启用异步电脑操作工具
    enable: false
    # 安装了持久桌面的 WSL 发行版
    distro: yunzai-llm-sandbox
    # admin=仅管理员；all=所有人共享同一桌面
    access: admin
    # 独立视觉/工具模型 id；留空使用默认模型
    model: ''
    # 独立于 chat.maxToolRounds
    maxSteps: 100
    # 每个电脑任务最长运行时间，单位分钟
    maxMinutes: 20
    # 每个任务累计输入（含缓存）
    maxInputTokens: 150000
    # 每个任务累计输出 token 上限
    maxOutputTokens: 30000
    # 全局等待队列最多容纳的任务数
    maxQueue: 8
    # 旧截图从工作上下文移除
    recentScreenshots: 2
    # 每一步模型请求的最大输出 token
    maxTokensPerStep: 1200
    # 电脑代理自己的思考强度，默认关闭以节省输出
    thinking: 'off'
    # Claude 使用追加式上下文，定期检查点以保留缓存命中
    checkpointSteps: 8
    # 后台结果回到对话后，模型最多可连续新建几次电脑任务（0 为禁止，防止任务无限串联）
    maxChainDepth: 1
  # 主聊天模型直接调用 Google Lens，上传本轮/引用的原图；先 npm run lens-setup
  # 复用持久桌面浏览器，无需 AGY CLI、AGY 登录或 AGY 服务，也无需启用 computer 工具
  googleLens:
    # 是否允许上传本轮原图到 Google Lens 反搜
    enable: false
    # admin=仅管理员；all=所有人
    access: admin
    # 安装了桌面及 Lens 浏览器依赖的 WSL 发行版
    distro: yunzai-llm-sandbox
  # AGY 宿主机异步工作进程：原生 sandbox + turbo，无需 WSL 或机器人 VM
  agy:
    # 需要 agy-setup 和本机已登录的 Antigravity 账号；自动批准所有工具请求
    enable: false
    # admin=仅管理员；all=所有人（等同向所有可调用者开放主机完整访问）
    access: admin
    # 留空使用 npm run agy-setup 安装到 Yunzai/resources/Yunzai-LLM-Plugin/agy-setup/agy.exe 的 CLI
    executable: ''
    # 每个 AGY 任务最长运行时间，单位分钟
    maxMinutes: 10
    # 全局等待队列最多容纳的 AGY 任务数
    maxQueue: 8
    # 后台结果回到对话后，模型最多可连续新建几次 AGY 任务（0 为禁止，防止任务无限串联）
    maxChainDepth: 1
  # 定时任务：模型可以安排稍后或按周期回到当前对话，例如「10分钟后提醒我」「每天早上8点播报天气」
  # 到点时机器人在原对话里执行任务并回复；网页面板「定时任务」可查看、编辑、取消
  schedule:
    # 是否启用 schedule 工具
    enable: true
    # admin=仅管理员；all=所有人
    access: all
    # 每人同时进行中的任务上限（管理员不限）
    maxPerUser: 5
    # 按间隔重复时的最短间隔，单位分钟
    minInterval: 30
    # 到点执行时最多可连续再设置几次任务（例如「半小时后再看看」），0 为禁止，防止无限循环
    maxChain: 3
  # 禁用的工具名（#llm工具列表 查看）
  disabled: []

# --------------------------------------------------------------------------
# 长期记忆：模型可以用 memory 工具记住「关于某人」和「关于本群」的事实，跨会话保留。
# 有硬上限，写满后模型必须合并/删除旧条目才能再记；接近上限时自动用便宜模型整理，不会无限增长。
# 用户可发送 #llm记忆 查看、#llm忘记我 清空自己的长期记忆。
# --------------------------------------------------------------------------
memory:
  # 长期事实记忆总开关
  enable: true
  # 每个人最多几条 / 总字数
  userMaxEntries: 20
  # 每个人全部事实记忆合计最多字符数
  userMaxChars: 1000
  # 每个群最多几条 / 总字数
  groupMaxEntries: 50
  # 每个群全部事实记忆合计最多字符数
  groupMaxChars: 3000
  # 每条最多字数
  entryMaxChars: 200
  # 群记忆写入：all = 任何人的对话都可让模型记录 / admin = 仅管理员的对话 / off = 不记群记忆
  groupWrite: all
  # 达到上限 80% 时自动整理合并（使用 utilityModel）
  autoCompact: true
  # 每次回复最多修改几次记忆
  maxWritesPerTurn: 3
  # 每个会话每天的聊天会整理成一条「当日概要」，可按日期检索（如“昨天”“上周六”“10月20日”）。保留天数（详细档案只保留 30 天）
  dailyDays: 365
  # 私聊时也检索对方所在群的旧聊天档案（群里本来就公开的内容）；群聊永远不会检索到私聊内容。默认关闭
  crossChatRecall: false
  # 把群里没有@机器人的普通聊天也存下来，每几十条整理成一段摘要并计入当日概要，回忆和按日期检索都能查到。
  # 只记录启用了插件的群，过滤敏感信息；需要后台模型（utilityModel）额外花费少量 token。关闭后只整理和机器人的对话
  groupChatArchive: true
  # 每次检索旧聊天（recall 工具、每轮自动回忆、网页面板的向量查询）最多返回几条，1-100。
  # 越大模型看到的旧聊天越多，但每轮的 token 也越多；自动回忆另外只取 2-3 条，无明确主题时跳过
  recallLimit: 5
  # 旧聊天档案优先按向量相似度检索；向量模型的提供商未配置 Key 或接口失败时退回关键词检索
  embedding:
    # 是否优先使用向量检索旧聊天；关闭后仍可用关键词
    enable: true
    # 向量模型 id（embeddingModels 中的别名）；Key 在对应提供商里设置
    model: voyage-context-4
    # 余弦相似度达到此值即视为相关（即使没有共同关键词）
    minScore: 0.3

# 技能：插件自带 skills/<名称>/SKILL.md；自建技能放在 Yunzai/config/Yunzai-LLM-Plugin/skills/<名称>/SKILL.md（同名时优先）
skills:
  # 是否向模型提供技能说明与 load_skill 工具；依赖未就绪时隐藏该技能
  enable: true

# 价格表来源（自动获取模型价格，按天刷新）
pricing:
  # 自动价格数据源，按配置的来源获取并合并
  sources: [litellm, openrouter]
  # 价格表刷新间隔，单位小时
  refreshHours: 24

# 网页管理面板：插件加载时自动启动，浏览器打开 http://<IP>:6190
web:
  # 是否启动网页管理面板
  enable: true
  # 监听地址：0.0.0.0 允许远程访问；若仅本机使用可设为 127.0.0.1
  host: 0.0.0.0
  # 网页面板监听端口
  port: 6190
  # 登录密码。留空则首次启动时随机生成，保存在 Yunzai/data/Yunzai-LLM-Plugin/web-auth.json 并打印在日志中
  password: ''
